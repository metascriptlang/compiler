[package]
name = "prop_amm_quasar"
version = "0.1.0"
description = "Quasar port of the Anchor v2 prop-amm bench program, for tools/solana/anchorBench.mjs"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "prop_amm_quasar"

[features]
alloc = []
client = []
debug = []

[dependencies]
quasar-lang = { git = "https://github.com/blueshift-gg/quasar", rev = "b0de7db4cd271654a2dcf78807dd865e98e0b339" }

[lints.rust.unexpected_cfgs]
level = "allow"

[workspace]

[profile.release]
overflow-checks = false
lto = "fat"
codegen-units = 1
opt-level = 3
[profile.release.build-override]
opt-level = 3
codegen-units = 1
